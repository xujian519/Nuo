name: Runner smoke

# Temporary: proves the self-hosted runner registered for this repository can
# pick up and finish a job. Dispatch-only, so no fork pull request can reach a
# runner running on a personal machine.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  self-hosted-smoke:
    runs-on: [self-hosted, macOS, ARM64, nuo-macos]
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Report the host
        run: |
          uname -a
          sw_vers
          xcodebuild -version
          swift --version

      - name: Run a repository guard
        run: python3 scripts/ci/verify-standards-contracts.py
